// CDM Theme Palettes (matching Crucible CommonDataModel ITER_THEMES)
var CDM_COLOR_THEMES = [
  ['#5b8def', '#3a6fd4', '#7ca4f5', '#9dbcfa', '#bdd4ff', '#4a7de0', '#6991e8', '#89a8f0'],
  ['#ef5b5b', '#d43a3a', '#f57c7c', '#fa9d9d', '#ffbdbd', '#e04a4a', '#e86969', '#f08989'],
  ['#5bef8d', '#3ad46a', '#7cf5a4', '#9dfabc', '#bdffd4', '#4ae07a', '#69e891', '#89f0a8'],
  ['#b85bef', '#9a3ad4', '#cc7cf5', '#dd9dfa', '#eebdff', '#a84ae0', '#bc69e8', '#cf89f0'],
  ['#5bcdef', '#3ab4d4', '#7cd8f5', '#9de4fa', '#bdf0ff', '#4ac2e0', '#69cce8', '#89d6f0'],
  ['#efb85b', '#d49a3a', '#f5cc7c', '#fadd9d', '#ffeebf', '#e0a84a', '#e8bc69', '#f0cf89']
];

function getCdmColor(themeIdx, shadeIdx) {
  var theme = CDM_COLOR_THEMES[themeIdx % CDM_COLOR_THEMES.length];
  return theme[shadeIdx % theme.length];
}

function formatCdmNumber(v) {
  if (v == null) return '-';
  var n = Number(v);
  if (isNaN(n)) return String(v);
  if (Math.abs(n) >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 1 });
  if (Math.abs(n) >= 10) return n.toFixed(2);
  if (Math.abs(n) >= 1) return n.toFixed(3);
  return n.toPrecision(3);
}

// Synchronized crosshair plugin for Chart.js
var cdmCrosshairPlugin = {
  id: 'cdmCrosshair',
  afterDraw: function(chart) {
    if (chart.crosshairIndex != null && chart.crosshairIndex >= 0) {
      var meta = chart.getDatasetMeta(0);
      if (meta && meta.data && meta.data[chart.crosshairIndex]) {
        var x = meta.data[chart.crosshairIndex].x;
        var yAxis = chart.scales.y;
        var ctx = chart.ctx;
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.moveTo(x, yAxis.top);
        ctx.lineTo(x, yAxis.bottom);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(125, 207, 255, 0.7)';
        ctx.stroke();
        ctx.restore();
      }
    }
  }
};

window._cdmSyncGroups = window._cdmSyncGroups || {};

function mountChart(containerId, chartData) {
  if (!chartData) return;

  var syncGroupId = chartData.sync_id || containerId;
  window._cdmSyncGroups[syncGroupId] = [];

  function updateSyncCrosshair(activeIndex) {
    var group = window._cdmSyncGroups[syncGroupId] || [];
    var timeLabel = (chartData.labels && chartData.labels[activeIndex]) ? chartData.labels[activeIndex] : '';

    group.forEach(function(item) {
      item.chart.crosshairIndex = activeIndex;
      item.chart.draw();

      // Update cursor display
      if (item.cursorEl) {
        if (activeIndex != null && activeIndex >= 0) {
          item.cursorEl.textContent = 'Time: ' + timeLabel;
        } else {
          item.cursorEl.textContent = 'Hover to inspect';
        }
      }

      // Update matrix values
      if (item.matrixEl && item.panelData) {
        var valSpans = item.matrixEl.querySelectorAll('.cdm-series-val');
        (item.panelData.datasets || []).forEach(function(ds, dsi) {
          if (valSpans[dsi]) {
            if (activeIndex != null && activeIndex >= 0 && ds.values && ds.values[activeIndex] != null) {
              valSpans[dsi].textContent = formatCdmNumber(ds.values[activeIndex]);
            } else {
              var lastVal = ds.values && ds.values.length ? ds.values[ds.values.length - 1] : '-';
              valSpans[dsi].textContent = formatCdmNumber(lastVal);
            }
          }
        });
      }
    });
  }

  function renderMatrix(matrixEl, panelData, chartInstance, themeIdx, unit) {
    if (!matrixEl || !panelData || !panelData.datasets) return;
    var html = '<div class="cdm-matrix-grid">';
    panelData.datasets.forEach(function(ds, dsi) {
      var color = getCdmColor(themeIdx, dsi);
      var lastVal = ds.values && ds.values.length ? ds.values[ds.values.length - 1] : '-';
      html += '<div class="cdm-matrix-item" data-dsi="' + dsi + '" title="Click to toggle series">' +
        '<div style="display:flex; align-items:center; overflow:hidden;">' +
          '<span class="cdm-series-dot" style="background:' + color + '"></span>' +
          '<span class="cdm-series-name">' + escHtml(ds.label || ('Series ' + (dsi + 1))) + '</span>' +
        '</div>' +
        '<span class="cdm-series-val">' + formatCdmNumber(lastVal) + '</span>' +
      '</div>';
    });
    html += '</div>';
    matrixEl.innerHTML = html;

    // Click handler to toggle series
    matrixEl.querySelectorAll('.cdm-matrix-item').forEach(function(itemEl) {
      itemEl.addEventListener('click', function() {
        var dsi = parseInt(itemEl.getAttribute('data-dsi'), 10);
        var meta = chartInstance.getDatasetMeta(dsi);
        meta.hidden = meta.hidden === null ? !chartInstance.data.datasets[dsi].hidden : null;
        if (meta.hidden) {
          itemEl.classList.add('hidden-series');
        } else {
          itemEl.classList.remove('hidden-series');
        }
        chartInstance.update();
      });
    });
  }

  // Multi-panel layout
  if (chartData.panels && chartData.panels.length > 1) {
    chartData.panels.forEach(function(panel, pi) {
      var panelCanvasId = containerId + '-panel-' + pi;
      var canvas = document.getElementById(panelCanvasId);
      if (!canvas) return;

      var cursorEl = document.getElementById('cdm-cursor-' + containerId + '-p' + pi);
      var matrixEl = document.getElementById('cdm-matrix-' + containerId + '-p' + pi);

      var datasets = (panel.datasets || []).map(function(ds, i) {
        var color = getCdmColor(pi, i);
        var cfg = {
          label: ds.label,
          data: ds.values,
          borderColor: color,
          backgroundColor: color,
          pointRadius: panel.datasets.length > 12 ? 0 : 2,
          pointHoverRadius: 5,
          borderWidth: 1.8,
        };
        if ((panel.type || chartData.type) === 'line') {
          cfg.fill = false;
          cfg.tension = 0.2;
        }
        return cfg;
      });

      var chartInstance = new Chart(canvas, {
        type: panel.type || chartData.type || 'line',
        data: { labels: chartData.labels || [], datasets: datasets },
        plugins: [cdmCrosshairPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          animation: { duration: 300 },
          plugins: {
            title: { display: false },
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(22, 22, 30, 0.95)',
              titleColor: '#c0caf5',
              bodyColor: '#c0caf5',
              borderColor: '#3b4261',
              borderWidth: 1,
              padding: 8,
              boxPadding: 4,
            }
          },
          scales: {
            x: {
              ticks: { color: '#565f89', font: { family: 'ui-monospace, monospace', size: 10 } },
              grid: { color: 'rgba(41, 46, 66, 0.6)' },
              title: {
                display: pi === chartData.panels.length - 1,
                text: chartData.x_label || 'Elapsed Time',
                color: '#565f89',
                font: { family: 'ui-monospace, monospace', size: 11, weight: '600' }
              }
            },
            y: {
              ticks: { color: '#565f89', font: { family: 'ui-monospace, monospace', size: 10 } },
              grid: { color: 'rgba(41, 46, 66, 0.6)' },
              title: {
                display: !!panel.unit,
                text: panel.unit || '',
                color: '#7aa2f7',
                font: { family: 'ui-monospace, monospace', size: 11, weight: '600' }
              }
            },
          },
          onHover: function(evt, activeElements) {
            if (activeElements && activeElements.length > 0) {
              updateSyncCrosshair(activeElements[0].index);
            }
          }
        },
      });

      canvas.addEventListener('mouseleave', function() {
        updateSyncCrosshair(null);
      });

      renderMatrix(matrixEl, panel, chartInstance, pi, panel.unit);
      window._cdmSyncGroups[syncGroupId].push({
        chart: chartInstance,
        cursorEl: cursorEl,
        matrixEl: matrixEl,
        panelData: panel
      });
    });
    return;
  }

  // Single panel chart
  var canvas = document.getElementById(containerId);
  if (!canvas) return;

  var cursorEl = document.getElementById('cdm-cursor-' + containerId);
  var matrixEl = document.getElementById('cdm-matrix-' + containerId);

  var datasets = (chartData.datasets || []).map(function(ds, i) {
    var color = getCdmColor(0, i);
    var cfg = {
      label: ds.label,
      data: ds.values,
      borderColor: color,
      backgroundColor: color,
      pointRadius: (chartData.datasets || []).length > 12 ? 0 : 2,
      pointHoverRadius: 5,
      borderWidth: 1.8,
    };
    if (chartData.type === 'line') {
      cfg.fill = false;
      cfg.tension = 0.2;
    }
    if (chartData.type === 'doughnut') {
      cfg.backgroundColor = CDM_COLOR_THEMES[0].slice(0, (ds.values || []).length);
    }
    return cfg;
  });

  var chartInstance = new Chart(canvas, {
    type: chartData.type || 'bar',
    data: { labels: chartData.labels || [], datasets: datasets },
    plugins: [cdmCrosshairPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      animation: { duration: 300 },
      plugins: {
        title: { display: false },
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(22, 22, 30, 0.95)',
          titleColor: '#c0caf5',
          bodyColor: '#c0caf5',
          borderColor: '#3b4261',
          borderWidth: 1,
          padding: 8,
          boxPadding: 4,
        }
      },
      scales: chartData.type === 'doughnut' ? {} : {
        x: {
          ticks: { color: '#565f89', font: { family: 'ui-monospace, monospace', size: 10 } },
          grid: { color: 'rgba(41, 46, 66, 0.6)' },
          title: {
            display: !!chartData.x_label,
            text: chartData.x_label || 'Elapsed Time',
            color: '#565f89',
            font: { family: 'ui-monospace, monospace', size: 11, weight: '600' }
          }
        },
        y: {
          ticks: { color: '#565f89', font: { family: 'ui-monospace, monospace', size: 10 } },
          grid: { color: 'rgba(41, 46, 66, 0.6)' },
          title: {
            display: !!chartData.unit,
            text: chartData.unit || '',
            color: '#7aa2f7',
            font: { family: 'ui-monospace, monospace', size: 11, weight: '600' }
          }
        },
      },
      onHover: function(evt, activeElements) {
        if (activeElements && activeElements.length > 0) {
          updateSyncCrosshair(activeElements[0].index);
        }
      }
    },
  });

  canvas.addEventListener('mouseleave', function() {
    updateSyncCrosshair(null);
  });

  renderMatrix(matrixEl, chartData, chartInstance, 0, chartData.unit);
  window._cdmSyncGroups[syncGroupId].push({
    chart: chartInstance,
    cursorEl: cursorEl,
    matrixEl: matrixEl,
    panelData: chartData
  });
}

function renderCustomFields(ticket) {
  var fields = ticket.custom_fields;
  if (!fields || Object.keys(fields).length === 0) return '';

  var promoted = ['verdict', 'review_summary', 'detailed_analysis', 'chart_data', 'results_url', 'hypothesis', 'evaluation_result', 'synthesis_result', 'dedup_result', 'introspection', 'introspection_summary'];
  var items = '';
  for (var k in fields) {
    if (promoted.indexOf(k) !== -1) continue;
    var v = fields[k];
    var display = typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v);
    items += '<span class="field-key">' + escHtml(k) + '</span>' +
             '<span class="field-val">' + escHtml(display) + '</span>';
  }
  var rest = '';
  if (items) {
    rest = '<details style="margin-top: 8px;">' +
      '<summary>Custom Fields</summary>' +
      '<div class="content"><div class="fields-grid">' + items + '</div></div>' +
    '</details>';
  }
  return rest;
}

// ── Event Polling & Rendering ──

var _lastResultHash = '';

async function refreshResultSection(ticketId) {
  if (!ticketId) return;
  try {
    var ticket = await api('/tickets/' + ticketId);
    // Skip rebuild if ticket data hasn't changed.
    // innerHTML comparison fails because browsers normalize HTML.
    var dataHash = JSON.stringify(ticket.custom_fields || {});
    if (dataHash === _lastResultHash) return;
    _lastResultHash = dataHash;

    var el = document.getElementById('result-section');
    if (el) {
      // Preserve open/closed state of <details> across rebuild
      var openDetails = {};
      el.querySelectorAll('details').forEach(function(d) {
        if (d.id) openDetails[d.id] = d.open;
        else {
          var s = d.querySelector('summary');
          if (s) openDetails[s.textContent.trim()] = d.open;
        }
      });
      el.innerHTML = renderCustomFields(ticket);
      el.querySelectorAll('details').forEach(function(d) {
        var key = d.id || (d.querySelector('summary') || {}).textContent;
        if (key && openDetails[key.trim()] !== undefined) d.open = openDetails[key.trim()];
      });
    }
    var hypo = document.getElementById('hypothesis-section');
    if (hypo) {
      var hypoOpen = {};
      hypo.querySelectorAll('details').forEach(function(d) {
        if (d.id) hypoOpen[d.id] = d.open;
        else {
          var s = d.querySelector('summary');
          if (s) hypoOpen[s.textContent.trim()] = d.open;
        }
      });
      hypo.innerHTML = renderHypothesisCard(ticket);
      hypo.querySelectorAll('details').forEach(function(d) {
        var key = d.id || (d.querySelector('summary') || {}).textContent;
        if (key && hypoOpen[key.trim()] !== undefined) d.open = hypoOpen[key.trim()];
      });
    }
    // Also refresh introspection on transitions
    var cf = ticket.custom_fields || {};
    var card = document.getElementById('introspection-card');
    var introContent = document.getElementById('introspection-content');
    if (card && introContent && cf.introspection_summary) {
      // Final summary: render once, then stop.
      card.classList.remove('introspection-hidden');
      if (!introContent.dataset.summaryRendered) {
        introContent.innerHTML = renderIntrospectionSummary(cf.introspection_summary);
        introContent.dataset.summaryRendered = '1';
      }
    } else if (card && introContent && cf.introspection) {
      card.classList.remove('introspection-hidden');
      var rsPending = '';
      if (isTicketTerminal(ticket.status || '')) {
        rsPending = '<div style="margin-top:8px; font-size:12px; color:var(--purple);">' +
          '<span class="spinner" style="width:12px; height:12px; border-width:1.5px; margin-right:4px;"></span>' +
          'Final summary pending\u2026</div>';
      }
      var narrativeDetails = introContent.querySelector('#introspection-narrative-details');
      var wasOpen = narrativeDetails ? narrativeDetails.open : false;
      var savedScroll = _saveNarrativeScroll(introContent);
      introContent.innerHTML = renderIntrospectionContent(cf.introspection) + rsPending;
      if (wasOpen) {
        var newDetails = introContent.querySelector('#introspection-narrative-details');
        if (newDetails) newDetails.open = true;
      }
      _restoreNarrativeScroll(introContent, savedScroll);
      _attachNarrativeOpenClick(introContent);
    }
  } catch {}
}

async function pollEvents(ticketId) {
  if (pollPaused) return;
  try {
    var data = await api('/tickets/' + ticketId + '/events?since=' + lastSeq + '&limit=500');
    var newEvents = data.events || [];
    if (newEvents.length > 0) {
      lastSeq = data.latest_seq;
      renderNewEvents(newEvents);
    }
    // Refresh trail and status badge from the ticket
    // — the single authoritative source.
    var ticket = await api('/tickets/' + ticketId);
    if (ticket.status_trail) {
      trailStates = ticket.status_trail.slice();
      rebuildTrail();
    }
    var statusEl = document.getElementById('detail-status-badge');
    if (statusEl && ticket.status) {
      statusEl.innerHTML = statusBadge(ticket.status);
    }
    var actionEl = document.getElementById('action-buttons');
    if (actionEl) {
      actionEl.innerHTML = actionButtonsHtml(ticket.status, ticket);
      bindActionButtons(ticketId);
    }
    refreshResultSection(ticketId);
    updateUsageSidebar(ticketId);
    updateIntrospectionCard(ticketId);

    // Proactive HITL: notify chat when ticket needs guidance
    if (chatEnabled && ticket.status === 'awaiting_customer_guidance') {
      var cf = ticket.custom_fields || {};
      var gs = cf.guidance_summary;
      if (gs && !document.getElementById('chat-guidance-' + ticketId)) {
        var guidanceMsg = '\ud83d\udd14 **' + ticketId + '** needs guidance\n\n';
        guidanceMsg += '**Agent:** ' + (gs.agent || '?') + '\n';
        guidanceMsg += '**Reason:** ' + (gs.reason || 'unknown') + '\n';
        if (gs.details) guidanceMsg += '\n' + gs.details.substring(0, 300) + '\n';
        if (gs.suggested_response) guidanceMsg += '\n**Suggestion:** ' + gs.suggested_response;
        var container = document.getElementById('ticket-chat-messages') || document.getElementById('chat-messages');
        if (container) {
          container.innerHTML += '<div class="chat-msg assistant" id="chat-guidance-' + escHtml(ticketId) + '">' + chatRender(guidanceMsg, 'assistant') + '</div>';
          container.scrollTop = container.scrollHeight;
        }
      }
    }
  } catch {}
}

function updateIntrospectionCard(ticketId) {
  if (!ticketId) return;
  var card = document.getElementById('introspection-card');
  var content = document.getElementById('introspection-content');
  if (!card || !content) return;

  api('/tickets/' + ticketId).then(function(ticket) {
    var cf = ticket.custom_fields || {};
    var summary = cf.introspection_summary;
    var intro = cf.introspection;

    // Final summary takes precedence when present.
    // Once rendered, skip re-renders — closed tickets are
    // static and re-rendering collapses open <details>.
    if (summary) {
      card.classList.remove('introspection-hidden');
      if (!content.dataset.summaryRendered) {
        content.innerHTML = renderIntrospectionSummary(summary);
        content.dataset.summaryRendered = '1';
      }
      return;
    }

    if (!intro) {
      card.classList.add('introspection-hidden');
      return;
    }
    card.classList.remove('introspection-hidden');

    // Terminal status but no summary yet — the introspection
    // agent is writing its final summary. Show an indicator.
    var status = ticket.status || '';
    var pendingHtml = '';
    if (isTicketTerminal(status)) {
      pendingHtml = '<div style="margin-top:8px; font-size:12px; color:var(--purple);">' +
        '<span class="spinner" style="width:12px; height:12px; border-width:1.5px; margin-right:4px;"></span>' +
        'Final summary pending…</div>';
    }

    // Preserve <details> open state and scroll position across re-renders.
    var narrativeDetails = content.querySelector('#introspection-narrative-details');
    var wasOpen = narrativeDetails ? narrativeDetails.open : false;
    var savedScroll = _saveNarrativeScroll(content);

    content.innerHTML = renderIntrospectionContent(intro) + pendingHtml;

    if (wasOpen) {
      var newDetails = content.querySelector('#introspection-narrative-details');
      if (newDetails) newDetails.open = true;
    }
    _restoreNarrativeScroll(content, savedScroll);
    _attachNarrativeOpenClick(content);
  }).catch(function() {});
}

function renderIntrospectionContent(intro) {
  var html = '';
  var anomalies = intro.anomalies || [];

  // Update LLM badge from config-driven field
  var badge = document.getElementById('introspection-llm-badge');
  if (badge && intro.llm_enabled !== undefined) {
    badge.textContent = intro.llm_enabled ? 'LLM' : 'deterministic';
    badge.style.background = intro.llm_enabled ? 'var(--purple)' : 'var(--bg-alt)';
    badge.style.color = intro.llm_enabled ? '#fff' : 'var(--text-muted)';
  }

  // Anomaly summary
  if (anomalies.length > 0) {
    var high = 0, med = 0, low = 0;
    for (var i = 0; i < anomalies.length; i++) {
      var s = (anomalies[i].severity || '').toLowerCase();
      if (s === 'high') high++;
      else if (s === 'medium') med++;
      else low++;
    }
    var countParts = [];
    if (high) countParts.push('<span style="color:var(--red)">' + high + ' high</span>');
    if (med) countParts.push('<span style="color:var(--yellow)">' + med + ' medium</span>');
    if (low) countParts.push('<span style="color:var(--text-muted)">' + low + ' low</span>');
    html += '<div style="font-size:13px; margin-bottom:6px">' +
      '<span style="color:var(--text-bright); font-weight:600">' + anomalies.length + '</span>' +
      ' anomal' + (anomalies.length === 1 ? 'y' : 'ies') +
      ' <span style="font-size:11px">(' + countParts.join(', ') + ')</span></div>';

    for (var i = 0; i < anomalies.length; i++) {
      var a = anomalies[i];
      var sevCls = 'sev-' + (a.severity || 'low').toLowerCase();
      html += '<div class="introspection-anomaly">' +
        '<span class="anomaly-severity ' + sevCls + '">' + escHtml(a.severity || '?') + '</span>' +
        '<span class="anomaly-desc">' + escHtml(a.description || '') + '</span>' +
      '</div>';
    }
  } else {
    html += '<div style="font-size:13px; color:var(--green)">No anomalies detected</div>';
  }

  // Narrative (collapsible, scrollable log)
  var narrativeLines = intro.narrative || [];
  if (typeof narrativeLines === 'string') {
    // Backward compat: old format was a single string.
    narrativeLines = narrativeLines ? [narrativeLines] : [];
  }
  if (narrativeLines.length > 0) {
    var narrativeHtml = '';
    for (var ni = 0; ni < narrativeLines.length; ni++) {
      var line = narrativeLines[ni];
      var isObservation = typeof line === 'string' && line.indexOf('[observation]') === 0;
      if (isObservation) {
        var obsText = line.substring('[observation] '.length);
        narrativeHtml += '<div style="padding:4px 6px; margin:2px 0; border-left:3px solid var(--purple);' +
          ' background:rgba(187,154,247,0.08); border-radius:0 4px 4px 0; font-size:12px;' +
          ' color:var(--text-bright)">' + escHtml(obsText) + '</div>';
      } else {
        narrativeHtml += '<div style="padding:2px 0; border-bottom:1px solid var(--border);">' +
          escHtml(line) + '</div>';
      }
    }
    html += '<details id="introspection-narrative-details" style="margin-top:8px; border:none;">' +
      '<summary style="font-size:12px; color:var(--text-muted); background:none; padding:4px 0;">' +
        'Narrative (' + narrativeLines.length + ' entries)</summary>' +
      '<div class="introspection-narrative" id="introspection-narrative-scroll">' + narrativeHtml + '</div>' +
    '</details>';
  }

  // Status summary
  if (intro.status_summary) {
    html += '<div class="introspection-status">' + escHtml(intro.status_summary) + '</div>';
  }

  return html;
}

function renderIntrospectionSummary(summary) {
  var html = '';
  var verdict = summary.verdict || 'unknown';
  var verdictCls = verdict === 'clean' ? 'pass'
    : verdict === 'needs_attention' ? 'fail' : 'inconclusive';
  var verdictLabel = verdict === 'clean' ? 'CLEAN RUN'
    : verdict === 'needs_attention' ? 'NEEDS ATTENTION'
    : verdict === 'minor_issues' ? 'MINOR ISSUES' : verdict.toUpperCase();

  html += '<div class="result-verdict ' + verdictCls + '" style="font-size:13px; margin-bottom:8px">' +
    verdictLabel + '</div>';

  // Stats
  var stats = summary.stats || {};
  html += '<div style="font-size:12px; color:var(--text-muted); margin-bottom:8px">' +
    (stats.total_events || 0) + ' events' +
    ' \u2022 ' + (stats.total_llm_calls || 0) + ' LLM calls' +
    ' \u2022 ' + (stats.total_tool_errors || 0) + ' tool errors' +
    '</div>';

  // Observations (LLM-generated)
  var obs = summary.observations || [];
  if (obs.length > 0) {
    for (var i = 0; i < obs.length; i++) {
      html += '<div style="font-size:12px; margin:4px 0; color:var(--text)">' +
        escHtml(obs[i]) + '</div>';
    }
  }

  // Recommendations
  var recs = summary.recommendations || [];
  if (recs.length > 0) {
    html += '<div style="margin-top:8px; margin-bottom:6px; font-size:12px; font-weight:600; color:var(--text-muted);' +
      ' text-transform:uppercase; letter-spacing:0.3px">Recommendations</div>';
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      var areaColor = r.area === 'infrastructure' ? 'var(--red)'
        : r.area === 'efficiency' ? 'var(--yellow)'
        : r.area === 'convergence' ? 'var(--orange)'
        : 'var(--cyan)';
      html += '<div style="margin:4px 0; font-size:12px">' +
        '<span style="color:' + areaColor + '; font-weight:600">' +
        escHtml(r.area || '?') + ':</span> ' +
        escHtml(r.suggestion || '') + '</div>';
    }
  }

  // Anomalies (collapsible)
  var anomalies = summary.anomalies || [];
  if (anomalies.length > 0) {
    html += '<details style="margin-top:8px; border:none;">' +
      '<summary style="font-size:12px; color:var(--text-muted); background:none; padding:4px 0;">' +
        'Anomalies (' + anomalies.length + ')</summary><div>';
    for (var i = 0; i < anomalies.length; i++) {
      var a = anomalies[i];
      var sevCls = 'sev-' + (a.severity || 'low').toLowerCase();
      html += '<div class="introspection-anomaly">' +
        '<span class="anomaly-severity ' + sevCls + '">' + escHtml(a.severity || '?') + '</span>' +
        '<span class="anomaly-desc">' + escHtml(a.description || '') + '</span>' +
      '</div>';
    }
    html += '</div></details>';
  }

  // Per-agent breakdown (collapsible)
  var agents = (stats.per_agent) || {};
  var agentNames = Object.keys(agents);
  if (agentNames.length > 0) {
    html += '<details style="margin-top:8px; border:none;">' +
      '<summary style="font-size:12px; color:var(--text-muted); background:none; padding:4px 0;">' +
        'Per-Agent Stats (' + agentNames.length + ')</summary><div>';
    for (var i = 0; i < agentNames.length; i++) {
      var name = agentNames[i];
      var s = agents[name];
      var short = name.replace(/-agent$/, '');
      html += '<div style="font-size:11px; margin:4px 0; font-family:var(--font-mono)">' +
        '<span style="color:var(--cyan); font-weight:600">' + escHtml(short) + '</span>: ' +
        (s.llm_calls || 0) + ' LLM / ' +
        (s.tool_calls || 0) + ' tools / ' +
        (s.tool_errors || 0) + ' errors' +
        '</div>';
    }
    html += '</div></details>';
  }

  return html;
}

function _saveNarrativeScroll(container) {
  var scrollEl = container.querySelector('#introspection-narrative-scroll');
  if (!scrollEl) return null;
  return scrollEl.scrollTop;
}

function _restoreNarrativeScroll(container, savedScroll) {
  if (savedScroll == null) return;
  var scrollEl = container.querySelector('#introspection-narrative-scroll');
  if (scrollEl) scrollEl.scrollTop = savedScroll;
}

function _attachNarrativeOpenClick(container) {
  // Listen for clicks on the <summary> element to detect
  // user-initiated opens. Unlike the 'toggle' event, 'click'
  // only fires on user interaction — never on programmatic
  // .open = true — so we don't need guard flags.
  var details = container.querySelector('#introspection-narrative-details');
  if (!details) return;
  var summary = details.querySelector('summary');
  if (!summary || summary.dataset.listenersAttached) return;
  summary.dataset.listenersAttached = '1';
  summary.addEventListener('click', function() {
    // At click time, details.open reflects the state BEFORE
    // the toggle, so !details.open means it's about to open.
    if (!details.open) {
      requestAnimationFrame(function() {
        var scrollEl = details.querySelector('#introspection-narrative-scroll');
        if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
      });
    }
  });
}

async function updateUsageSidebar(ticketId) {
  try {
    var data = await api('/tickets/' + ticketId + '/usage');
    var el = document.getElementById('llm-usage');
    if (!el || !data.usage) return;
    var u = data.usage;
    if (u.llm_calls === 0) {
      el.innerHTML = '<span style="color:var(--text-muted)">No LLM calls yet</span>';
      return;
    }
    var cost = data.estimated_cost_usd;
    var uCachePct = fmtCachePct(u);
    el.innerHTML =
      '<div style="margin-bottom:4px">' +
        '<span style="color:var(--cyan); font-size:16px; font-weight:700">' +
          u.total_tokens.toLocaleString() + '</span>' +
        '<span style="color:var(--text-muted)"> tokens</span>' +
        (uCachePct ? '<span style="color:var(--text-muted); font-size:11px; margin-left:6px">(' + uCachePct + ')</span>' : '') +
      '</div>' +
      '<div style="margin-bottom:4px; font-size:11px; font-family:var(--font-mono)">' +
        ((u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0)).toLocaleString() + ' in / ' +
        u.output_tokens.toLocaleString() + ' out' +
      '</div>' +
      '<div style="margin-bottom:4px">' +
        '<span style="color:var(--green)">' + u.llm_calls + '</span> calls' +
        ' &middot; ' + (u.total_duration_ms / 1000).toFixed(1) + 's' +
      '</div>' +
      '<div style="margin-bottom:4px">' +
        'Est. <span style="color:var(--yellow); font-size:14px; font-weight:700">' +
          fmtCost(cost) + '</span>' +
      '</div>' +
      '';

    var agents = data.by_agent || {};
    var agentNames = Object.keys(agents);
    if (agentNames.length > 0) {
      agentNames.sort(function(a, b) {
        return (agents[b].estimated_cost_usd || 0) - (agents[a].estimated_cost_usd || 0);
      });
      var maxCost = agents[agentNames[0]].estimated_cost_usd || 1;
      var agentHtml = '<div style="margin-top:8px; border-top:1px solid var(--border); padding-top:8px">';
      agentHtml += '<div style="color:var(--text-muted); font-size:10px; text-transform:uppercase; ' +
        'letter-spacing:0.5px; margin-bottom:6px">By Agent</div>';
      for (var ai = 0; ai < agentNames.length; ai++) {
        var an = agentNames[ai];
        var au = agents[an];
        var acost = au.estimated_cost_usd || 0;
        var pct = maxCost > 0 ? Math.round((acost / maxCost) * 100) : 0;
        var shortName = an.replace(/-agent$/, '');
        var agentCache = fmtCachePct(au);
        agentHtml +=
          '<div class="agent-cost-row">' +
            '<span class="agent-cost-name" title="' + escHtml(an) + '">' + escHtml(shortName) + '</span>' +
            '<span class="agent-cost-bar-bg">' +
              '<span class="agent-cost-bar" style="width:' + pct + '%"></span>' +
            '</span>' +
            '<span class="agent-cost-val">' + fmtCost(acost) + '</span>' +
          '</div>' +
          '<div class="agent-cost-detail">' +
            ((au.models_used && au.models_used.length > 0) ?
              au.models_used.join(', ') + ': ' : '') +
            au.total_tokens.toLocaleString() + 't' +
            (agentCache ? ' (' + agentCache + ')' : '') +
            ' &middot; ' +
            au.llm_calls + ' calls &middot; ' +
            (au.total_duration_ms / 1000).toFixed(1) + 's' +
          '</div>';
      }
      agentHtml += '</div>';
      el.innerHTML += agentHtml;
    }
  } catch {}
}

function renderNewEvents(events) {
  var container = document.getElementById('event-stream');
  if (!container) return;

  for (var i = 0; i < events.length; i++) {
    var evt = events[i];
    if (renderedEvents.indexOf(evt.seq) !== -1) continue;
    renderedEvents.push(evt.seq);
    var html = renderEvent(evt);
    if (html) container.insertAdjacentHTML('beforeend', html);
  }

  var countEl = document.getElementById('event-count');
  if (countEl) countEl.textContent = renderedEvents.length;

  if (autoScroll) {
    container.scrollTop = container.scrollHeight;
  }
}



var trailStates = [];

var STATUS_AGENT_NAME = {
  'triage_pending': 'triage-agent',
  'analyzing': 'analyze-agent',
  'awaiting_hardware': 'resource-agent',
  'awaiting_provision': 'provisioning-agent',
  'executing_benchmark': 'benchmark-agent',
  'awaiting_review': 'review-agent',
  'awaiting_teardown': 'resource-teardown-agent',
  'retrospective_pending': 'retrospective-agent',
};



function rebuildTrail() {
  var trail = document.getElementById('transition-trail');
  if (!trail) return;
  var html = '';
  for (var i = 0; i < trailStates.length; i++) {
    if (i > 0) html += '<span class="trail-arrow">&rarr;</span>';
    html += '<span class="trail-badge-link" data-trail-idx="' + i + '">' +
      statusBadge(trailStates[i]) + '</span>';
  }
  trail.innerHTML = html;
  trail.querySelectorAll('.trail-badge-link').forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(el.dataset.trailIdx);
      scrollToAgentForTrail(idx);
    });
  });
}

function scrollToAgentForTrail(trailIdx) {
  var status = trailStates[trailIdx];
  var agentName = STATUS_AGENT_NAME[status];
  var container = document.getElementById('event-stream');
  var sections = document.querySelectorAll('#event-stream .agent-section');
  if (!container || !sections.length) return;

  if (agentName) {
    var occurrence = 0;
    for (var i = 0; i < trailIdx; i++) {
      if (trailStates[i] === status) occurrence++;
    }
    var found = 0;
    for (var j = 0; j < sections.length; j++) {
      var nameEl = sections[j].querySelector('.agent-name');
      if (nameEl && nameEl.textContent === agentName) {
        if (found === occurrence) {
          sections[j].open = true;
          container.scrollTop = sections[j].offsetTop - container.offsetTop;
          return;
        }
        found++;
      }
    }
  }

  if (sections.length > 0) {
    var last = sections[sections.length - 1];
    last.open = true;
    container.scrollTop = last.offsetTop - container.offsetTop;
  }
}

function renderEvent(evt) {
  var etype = evt.event_type;
  var data = evt.data || {};
  var ts = fmtTimeShort(evt.timestamp);
  var agent = evt.agent || '';

  // Introspection agent events are shown in the dedicated
  // introspection card, not in the main event stream.
  if (agent === 'introspection-agent' && etype !== 'guidance_summary') return '';

  switch (etype) {
    case 'agent_started':
      return renderAgentStarted(evt, ts, agent, data);

    case 'agent_finished':
      return '<div class="event">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label label-agent">FINISHED</span>' +
        '<span style="color:var(--text-muted)">' + escHtml(agent) + '</span>' +
      '</div>';

    case 'agent_error':
      return '<div class="event">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label label-error">ERROR</span>' +
        '<span>' + escHtml(agent) + ': ' + escHtml(data.reason || 'Unknown error') + '</span>' +
      '</div>';

    case 'llm_request':
      return '<div class="event">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label label-llm">LLM REQUEST</span>' +
        '<span style="color:var(--text-muted)">iteration ' + (data.iteration || '?') + '</span>' +
      '</div>';

    case 'llm_response':
      return renderLlmResponse(ts, data);

    case 'llm_usage':
      return renderLlmUsage(ts, data);

    case 'tool_called':
      return renderToolCalled(ts, data);

    case 'tool_result':
      return renderToolResult(ts, data);

    case 'tool_skipped':
      return '<div class="event">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label label-tool">TOOL SKIPPED</span>' +
        '<span style="color:var(--text-muted)">' + escHtml(data.tool || '?') + ': ' + escHtml(data.reason || '') + '</span>' +
      '</div>';

    case 'build_complete':
      return '<div class="event">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label" style="background:var(--green);color:#fff">BUILD COMPLETE</span>' +
        '<span>' + escHtml(data.build_name || '') + '</span>' +
        (data.image_url ? '<div style="font-size:11px;color:var(--text-muted);margin-left:70px">' + escHtml(data.image_url) + '</div>' : '') +
      '</div>';

    case 'build_failed':
      return '<div class="event">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label label-error">BUILD FAILED</span>' +
        '<span>' + escHtml(data.error || 'Unknown error') + '</span>' +
      '</div>';

    case 'anomaly_detected':
      var aSev = (data.severity || 'medium').toUpperCase();
      var aColor = aSev === 'CRITICAL' ? '#d32f2f' : (aSev === 'HIGH' ? '#e65100' : 'var(--accent)');
      return '<div class="event" style="border-left:3px solid ' + aColor + ';padding-left:8px">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label" style="background:' + aColor + ';color:#fff">⚠ ' + aSev + '</span>' +
        '<span>' + escHtml(data.description || data.type || 'Anomaly detected') + '</span>' +
      '</div>';

    case 'guidance_summary':
      var gActions = (data.suggested_actions || []).map(function(a) {
        return '<li>' + escHtml(a) + '</li>';
      }).join('');
      var gSuggestion = data.suggested_response
        ? '<div style="margin-top:6px;padding:6px;background:var(--bg-alt);border-radius:4px;font-size:12px"><strong>Suggestion:</strong> ' + escHtml(data.suggested_response) + '</div>'
        : '';
      return '<div class="event" style="border-left:3px solid #1565c0;padding-left:8px;margin:4px 0">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label" style="background:#1565c0;color:#fff">💡 INTROSPECTION</span>' +
        '<div style="margin-top:4px">' +
          (data.agent ? '<strong>' + escHtml(data.agent) + '</strong>: ' : '') + escHtml(data.reason || 'needs guidance') +
          '<div style="font-size:12px;color:var(--text-muted);margin-top:2px">' + escHtml((data.details || '').substring(0, 300)) + '</div>' +
          (gActions ? '<ul style="font-size:12px;margin:4px 0 0 16px;padding:0">' + gActions + '</ul>' : '') +
          gSuggestion +
        '</div>' +
      '</div>';

    case 'transition':
    case 'status_change':
      return '';

    case 'tool_progress':
      return '<div class="event tool-progress">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label label-progress">PROGRESS</span>' +
        '<span style="color:var(--text-muted)">(' + escHtml(agent) + ') ' + escHtml(data.body || '') + '</span>' +
      '</div>';

    case 'comment':
      return '<div class="event">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label label-comment">COMMENT</span>' +
        '<span style="color:var(--text-muted)">(' + escHtml(agent) + ')</span>' +
        '<div class="event-text short">' + escHtml(data.body || '') + '</div>' +
      '</div>';

    default:
      return '<div class="event">' +
        '<span class="event-ts">' + ts + '</span>' +
        '<span class="event-label" style="color:var(--text-muted)">' + escHtml(etype) + '</span>' +
      '</div>';
  }
}

function renderAgentStarted(evt, ts, agent, data) {
  var sysPrompt = data.system_prompt || '';
  var initialMsgs = data.initial_messages || [];

  var promptHtml = '';
  if (sysPrompt) {
    promptHtml =
      '<details>' +
        '<summary style="font-size:12px; color:var(--text-muted);">System Prompt (' + sysPrompt.length + ' chars)</summary>' +
        '<div class="content"><div class="sys-prompt">' + escHtml(sysPrompt) + '</div></div>' +
      '</details>';
  }

  var msgsHtml = '';
  for (var i = 0; i < initialMsgs.length; i++) {
    var m = initialMsgs[i];
    var role = (m.role || '?').toUpperCase();
    var content = typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2);
    msgsHtml +=
      '<details>' +
        '<summary style="font-size:12px;">' + role + ' message (' + content.length + ' chars)</summary>' +
        '<div class="content"><div class="event-text">' + escHtml(content) + '</div></div>' +
      '</details>';
  }

  // Deterministic agents (no system_prompt) — show data fields
  var dataHtml = '';
  if (!sysPrompt && !initialMsgs.length) {
    var keys = Object.keys(data);
    if (keys.length > 0) {
      dataHtml = '<div style="font-size:12px; color:var(--text-muted); margin-top:4px">';
      keys.forEach(function(k) {
        var v = data[k];
        var display = typeof v === 'object' ? JSON.stringify(v) : String(v);
        if (display.length > 200) display = display.substring(0, 200) + '...';
        dataHtml += '<div><strong>' + escHtml(k) + ':</strong> ' + escHtml(display) + '</div>';
      });
      dataHtml += '</div>';
    }
  }

  return '<details class="agent-section" open>' +
    '<summary>' +
      '<span class="agent-name">' + escHtml(agent) + '</span>' +
      '<span style="color:var(--text-muted); font-size:12px; margin-left:auto;">' + ts + '</span>' +
    '</summary>' +
    '<div class="content">' + promptHtml + msgsHtml + dataHtml + '</div>' +
  '</details>';
}

function renderLlmResponse(ts, data) {
  var text = data.text || '';
  var iteration = data.iteration || '?';
  var stop = data.stop_reason || '?';

  var textHtml = '';
  if (text) {
    if (text.length > 500) {
      textHtml =
        '<details>' +
          '<summary style="font-size:12px;">Response text (' + text.length + ' chars)</summary>' +
          '<div class="content"><div class="event-text">' + escHtml(text) + '</div></div>' +
        '</details>';
    } else {
      textHtml = '<div class="event-text short">' + escHtml(text) + '</div>';
    }
  }

  return '<div class="event">' +
    '<span class="event-ts">' + ts + '</span>' +
    '<span class="event-label label-llm">LLM RESPONSE</span>' +
    '<span style="color:var(--text-muted); font-size:12px;">iter ' + iteration + ', stop=' + stop +
      (data.duration_ms ? ' &middot; ' + (data.duration_ms / 1000).toFixed(1) + 's' : '') +
    '</span>' +
    textHtml +
  '</div>';
}

function renderLlmUsage(ts, data) {
  var inTok = (data.input_tokens || 0).toLocaleString();
  var outTok = (data.output_tokens || 0).toLocaleString();
  var model = data.model || '';
  var dur = data.duration_ms ? ' &middot; ' + (data.duration_ms / 1000).toFixed(1) + 's' : '';
  return '<div class="event">' +
    '<span class="event-ts">' + ts + '</span>' +
    '<span class="event-label" style="background:var(--cyan); color:#000">TOKENS</span>' +
    '<span style="color:var(--text-muted); font-size:12px;">' +
      inTok + ' in &middot; ' + outTok + ' out' + dur +
      (model ? ' &middot; ' + escHtml(model) : '') +
    '</span>' +
  '</div>';
}

function renderToolCalled(ts, data) {
  var tool = data.tool || '?';
  var input = data.input;
  var inputHtml = '';

  if (input) {
    var formatted = typeof input === 'object' ? prettyJson(input) : String(input);
    if (formatted.length > 300) {
      inputHtml =
        '<details>' +
          '<summary style="font-size:12px; color:var(--text-muted);">Input (' + formatted.length + ' chars)</summary>' +
          '<div class="content"><div class="event-text">' + escHtml(formatted) + '</div></div>' +
        '</details>';
    } else {
      inputHtml = '<div class="event-text short">' + escHtml(formatted) + '</div>';
    }
  }

  return '<div class="event">' +
    '<div class="tool-call">' +
      '<span class="event-ts">' + ts + '</span>' +
      '<span class="event-label label-tool">TOOL</span>' +
      '<span class="tool-name">' + escHtml(tool) + '</span>' +
      inputHtml +
    '</div>' +
  '</div>';
}

function renderToolResult(ts, data) {
  var tool = data.tool || '?';
  var isError = data.is_error;
  var content = data.content;
  var contentLen = data.content_length || 0;

  var cls = isError ? 'tool-result-err' : 'tool-result-ok';
  var errTag = isError ? ' <span style="color:var(--red)">ERROR</span>' : '';

  var contentHtml = '';
  if (content != null) {
    var formatted;
    try {
      var parsed = JSON.parse(content);
      formatted = JSON.stringify(parsed, null, 2);
    } catch (e) {
      formatted = String(content);
    }
    if (formatted.length > 500) {
      contentHtml =
        '<details>' +
          '<summary style="font-size:12px; color:var(--text-muted);">Result (' + formatted.length + ' chars)</summary>' +
          '<div class="content"><div class="event-text">' + escHtml(formatted) + '</div></div>' +
        '</details>';
    } else {
      contentHtml = '<div class="event-text short">' + escHtml(formatted) + '</div>';
    }
  } else if (contentLen > 0) {
    contentHtml = '<span style="color:var(--text-muted); font-size:12px;">(' + contentLen + ' bytes)</span>';
  }

  return '<div class="event">' +
    '<div class="tool-call ' + cls + '">' +
      '<span class="event-ts">' + ts + '</span>' +
      '<span class="event-label label-tool">RESULT' + errTag + '</span>' +
      '<span class="tool-name">' + escHtml(tool) + '</span>' +
      contentHtml +
    '</div>' +
  '</div>';
}

// ── Polling controls ──

function togglePoll() {
  pollPaused = !pollPaused;
  var btn = document.getElementById('btn-poll-toggle');
  var dot = document.getElementById('poll-dot');
  if (btn) {
    btn.classList.toggle('active', !pollPaused);
    btn.innerHTML = pollPaused
      ? '<span class="poll-dot paused" id="poll-dot"></span> Paused'
      : '<span class="poll-dot live" id="poll-dot"></span> Live';
  }
}

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  var btn = document.getElementById('btn-auto-scroll');
  if (btn) {
    btn.classList.toggle('active', autoScroll);
    btn.textContent = autoScroll ? 'Scroll' : 'Scroll off';
  }
}

function initPanelDivider() {
  var divider = document.getElementById('panel-divider');
  var panels = document.getElementById('detail-panels');
  var left = document.getElementById('detail-left-panel');
  var right = document.querySelector('.detail-right-panel');
  if (!divider || !panels || !left || !right) return;

  var MIN_WIDTH = 250;

  var savedPct = localStorage.getItem('panelDividerPct');
  if (savedPct) {
    var pct = parseFloat(savedPct);
    if (pct > 0 && pct < 100) {
      left.style.flex = '0 0 ' + pct + '%';
      right.style.flex = '0 0 ' + (100 - pct) + '%';
    }
  }

  divider.addEventListener('mousedown', function(e) {
    e.preventDefault();
    document.body.classList.add('panel-resizing');
    divider.classList.add('dragging');

    var startX = e.clientX;
    var startLeftWidth = left.getBoundingClientRect().width;
    var totalWidth = panels.getBoundingClientRect().width - divider.getBoundingClientRect().width;

    function onMouseMove(e) {
      var dx = e.clientX - startX;
      var newLeftWidth = startLeftWidth + dx;
      if (newLeftWidth < MIN_WIDTH) newLeftWidth = MIN_WIDTH;
      if (totalWidth - newLeftWidth < MIN_WIDTH) newLeftWidth = totalWidth - MIN_WIDTH;
      var leftPct = (newLeftWidth / totalWidth) * 100;
      left.style.flex = '0 0 ' + leftPct + '%';
      right.style.flex = '0 0 ' + (100 - leftPct) + '%';
    }

    function onMouseUp() {
      document.body.classList.remove('panel-resizing');
      divider.classList.remove('dragging');
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      var finalPct = (left.getBoundingClientRect().width / totalWidth) * 100;
      localStorage.setItem('panelDividerPct', finalPct.toFixed(2));
    }

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });

  divider.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    document.body.classList.add('panel-resizing');
    divider.classList.add('dragging');

    var startX = touch.clientX;
    var startLeftWidth = left.getBoundingClientRect().width;
    var totalWidth = panels.getBoundingClientRect().width - divider.getBoundingClientRect().width;

    function onTouchMove(e) {
      var t = e.touches[0];
      var dx = t.clientX - startX;
      var newLeftWidth = startLeftWidth + dx;
      if (newLeftWidth < MIN_WIDTH) newLeftWidth = MIN_WIDTH;
      if (totalWidth - newLeftWidth < MIN_WIDTH) newLeftWidth = totalWidth - MIN_WIDTH;
      var leftPct = (newLeftWidth / totalWidth) * 100;
      left.style.flex = '0 0 ' + leftPct + '%';
      right.style.flex = '0 0 ' + (100 - leftPct) + '%';
    }

    function onTouchEnd() {
      document.body.classList.remove('panel-resizing');
      divider.classList.remove('dragging');
      document.removeEventListener('touchmove', onTouchMove);
      document.removeEventListener('touchend', onTouchEnd);
      var finalPct = (left.getBoundingClientRect().width / totalWidth) * 100;
      localStorage.setItem('panelDividerPct', finalPct.toFixed(2));
    }

    document.addEventListener('touchmove', onTouchMove);
    document.addEventListener('touchend', onTouchEnd);
  });
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  if (artifactTimer) {
    clearInterval(artifactTimer);
    artifactTimer = null;
  }
  pollPaused = false;
  lastSeq = 0;
  renderedEvents = [];
}

// ── Main render ──

function render() {
  var route = parseRoute();
  currentView = route.view;
  currentTicketId = route.ticketId || null;

  if (route.view === 'detail' && route.ticketId) {
    renderDetail(route.ticketId);
  } else {
    renderList();
  }
}

render();

// ── Chat UI ──────────────────────────────────────────────

var chatEnabled = false;
var currentTicketForChat = null;

async function initChat() {
  // Check if chat API is available. Authenticated users get
  // full access; anonymous users get read-only if enabled.
  try {
    var headers = getAuthHeaders();
    var r = await fetch(API + '/chat/history', { headers: headers });
    if (r.ok) {
      chatEnabled = true;
      document.getElementById('chat-container').style.display = 'block';
      var data = await r.json();
      renderChatMessages('chat-messages', data.messages || []);
      updateChatCost(data.usage || {});
    }
  } catch(e) { /* chat not available */ }
}

function chatRender(text, role) {
  // Render markdown for assistant messages, escape for user/system
  if (role === 'assistant' && typeof marked !== 'undefined' && marked.parse) {
    try {
      var html = marked.parse(text);
      // Sanitize to prevent XSS from LLM-generated HTML
      if (typeof DOMPurify !== 'undefined') {
        html = DOMPurify.sanitize(html);
      }
      return html;
    } catch(e) { /* fall through */ }
  }
  return escHtml(text);
}

function renderChatMessages(containerId, messages) {
  var el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = messages.map(function(m) {
    var cls = m.role === 'user' ? 'user' : 'assistant';
    return '<div class="chat-msg ' + cls + '">' + chatRender(m.text || '', m.role) + '</div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function appendChatMessage(containerId, role, text) {
  var el = document.getElementById(containerId);
  if (!el) return;
  var cls = role === 'user' ? 'user' : (role === 'system' ? 'system' : 'assistant');
  el.innerHTML += '<div class="chat-msg ' + cls + '">' + chatRender(text, role) + '</div>';
  el.scrollTop = el.scrollHeight;
}

function updateChatCost(usage, elId) {
  var el = document.getElementById(elId || 'chat-cost');
  if (!el || !usage) return;
  var calls = usage.llm_calls || 0;
  if (calls === 0) { el.innerHTML = ''; return; }
  var total = usage.total_tokens || ((usage.input_tokens||0) + (usage.output_tokens||0));
  var cachePct = usage.cache_pct || 0;
  var model = usage.model || '';
  var parts = [];
  if (model) parts.push('<span style="color:var(--text-muted)">' + escHtml(model) + '</span>');
  parts.push('<span style="color:var(--cyan)">' + total.toLocaleString() + '</span> tokens');
  if (cachePct > 0) parts.push('<span style="color:var(--text-muted)">(' + cachePct + '% cached)</span>');
  parts.push('<span style="color:var(--green)">' + calls + '</span> calls');
  var cost = usage.estimated_cost_usd || 0;
  if (cost > 0) parts.push('<span style="color:var(--yellow)">' + fmtCost(cost) + '</span>');
  el.innerHTML = parts.join(' &middot; ');
}

async function sendChatMessage() {
  var input = document.getElementById('chat-input');
  var btn = document.getElementById('chat-send');
  var msg = (input.value || '').trim();
  if (!msg) return;

  input.value = '';
  btn.disabled = true;
  appendChatMessage('chat-messages', 'user', msg);
  appendChatMessage('chat-messages', 'system', 'Thinking...');

  try {
    var r = await fetch(API + '/chat/message', {
      method: 'POST',
      headers: Object.assign({'Content-Type': 'application/json'}, getAuthHeaders()),
      body: JSON.stringify({ message: msg })
    });
    // Remove 'Thinking...' indicator
    var container = document.getElementById('chat-messages');
    var thinking = container.querySelector('.chat-msg.system:last-child');
    if (thinking && thinking.textContent === 'Thinking...') thinking.remove();

    if (r.ok) {
      var data = await r.json();
      appendChatMessage('chat-messages', 'assistant', data.response || '');
      updateChatCost(data.usage || {});
    } else {
      var errMsg = 'Something went wrong (HTTP ' + r.status + '). ';
      if (r.status === 504 || r.status === 408) {
        errMsg = 'The request timed out. Try a simpler question, or break your request into smaller steps.';
      } else if (r.status === 503) {
        errMsg = 'Chat agent is not available. Check that chat is enabled in the configuration.';
      } else if (r.status === 401) {
        errMsg = 'Authentication required. Please log in to use the chat.';
      } else if (r.status === 429) {
        errMsg = 'Rate limit reached. Please wait a moment and try again.';
      }
      appendChatMessage('chat-messages', 'system', errMsg);
    }
  } catch(e) {
    var container = document.getElementById('chat-messages');
    var thinking = container.querySelector('.chat-msg.system:last-child');
    if (thinking && thinking.textContent === 'Thinking...') thinking.remove();
    appendChatMessage('chat-messages', 'system', 'Connection error. The server may be restarting — try again in a moment.');
  }
  btn.disabled = false;
  input.focus();
}

async function sendTicketChatMessage() {
  var input = document.getElementById('ticket-chat-input');
  var msg = (input.value || '').trim();
  if (!msg || !currentTicketForChat) return;

  input.value = '';
  appendChatMessage('ticket-chat-messages', 'user', msg);
  appendChatMessage('ticket-chat-messages', 'system', 'Thinking...');

  try {
    var r = await fetch(API + '/chat/message', {
      method: 'POST',
      headers: Object.assign({'Content-Type': 'application/json'}, getAuthHeaders()),
      body: JSON.stringify({ message: msg, ticket_context: currentTicketForChat })
    });
    var container = document.getElementById('ticket-chat-messages');
    var thinking = container.querySelector('.chat-msg.system:last-child');
    if (thinking && thinking.textContent === 'Thinking...') thinking.remove();

    if (r.ok) {
      var data = await r.json();
      appendChatMessage('ticket-chat-messages', 'assistant', data.response || '');
      updateChatCost(data.usage || {}, 'ticket-chat-cost');
    } else {
      var tErr = r.status === 504 || r.status === 408
        ? 'Request timed out. Try a simpler question.'
        : 'Something went wrong (HTTP ' + r.status + ')';
      appendChatMessage('ticket-chat-messages', 'system', tErr);
    }
  } catch(e) {
    var container = document.getElementById('ticket-chat-messages');
    var thinking = container.querySelector('.chat-msg.system:last-child');
    if (thinking && thinking.textContent === 'Thinking...') thinking.remove();
    appendChatMessage('ticket-chat-messages', 'system', 'Connection error');
  }
  input.focus();
}

// Enter key support
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    if (e.target.id === 'chat-input') {
      e.preventDefault();
      sendChatMessage();
    } else if (e.target.id === 'ticket-chat-input') {
      e.preventDefault();
      sendTicketChatMessage();
    }
  }
});

// Initialize chat on page load
initChat();
</script>
